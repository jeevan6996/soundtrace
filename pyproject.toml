[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "soundtrace"
version = "0.1.0"
description = "Evidence-first search inside audio recordings"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116,<1", "uvicorn>=0.34,<1", "numpy>=2,<3", "scipy>=1.15,<2", "soundfile>=0.13,<1"]

[project.optional-dependencies]
model = ["torch>=2.6,<3", "transformers>=4.57,<5", "huggingface-hub>=0.34,<1", "librosa>=0.11,<1"]
dev = ["pytest>=8,<10", "httpx2>=2.7,<3", "ruff>=0.12,<1", "mypy>=1.17,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
